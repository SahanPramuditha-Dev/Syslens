[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "syslens"
version = "1.0.0"
description = "A lightweight observability, diagnostics, and anomaly detection platform for developer environments"
readme = "README.md"
authors = [
    { name = "SysLens Team", email = "info@syslens.io" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "psutil>=5.9.0",
    "rich>=13.0.0"
]

[project.scripts]
syslens = "syslens.cli:main"
syslensd = "syslens.dashboard.app:serve"

[tool.setuptools]
packages = ["syslens", "syslens.core", "syslens.engine", "syslens.plugins", "syslens.dashboard", "syslens.utils"]

[tool.setuptools.package-data]
syslens = ["dashboard/static/*", "dashboard/static/web/*"]
