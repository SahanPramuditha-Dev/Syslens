name: Bug report
description: Report a reproducible problem in SysLens
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Remove hostnames, IP addresses, usernames, tokens, or other sensitive system data from public logs and screenshots.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, SysLens version, and installation method
  - type: textarea
    id: context
    attributes:
      label: Sanitized logs or additional context
